<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#071527" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <!-- Subtle mesh radial lights -->
    <radialGradient id="glow-cyan" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-blue" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Badge Gradients -->
    <linearGradient id="pill-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="pill-border-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pill-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="pill-border-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pill-grad-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="pill-border-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <style>
    /* Subtle CSS Animations in Background Layer */
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.22; transform: scale(1); }
      50% { opacity: 0.38; transform: scale(1.08); }
    }
    @keyframes streamDash {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-12px) translateX(6px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    .orb-cyan { animation: pulseOrb 7s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-purple { animation: pulseOrb 9s ease-in-out infinite alternate; transform-origin: 1000px 120px; }
    .data-wire { stroke-dasharray: 8 12; animation: streamDash 3s linear infinite; }
    .p1 { animation: floatParticle 6s ease-in-out infinite; }
    .p2 { animation: floatParticle 8s ease-in-out infinite 2s; }
    .p3 { animation: floatParticle 7s ease-in-out infinite 4s; }
    .pill { transition: all 0.3s ease; }
    .pill:hover { filter: brightness(1.2); }
  </style>

  <!-- Deep Base Background -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />

  <!-- Ambient Light Orbs (Background layer) -->
  <rect width="1200" height="360" fill="url(#glow-cyan)" class="orb-cyan" />
  <rect width="1200" height="360" fill="url(#glow-purple)" class="orb-purple" />
  <rect width="1200" height="360" fill="url(#glow-blue)" />

  <!-- Tech Geometric Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Glowing Connectivity Circuit Streams (Far background) -->
  <path d="M 50 180 Q 200 80, 400 180 T 800 180 T 1150 120" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" class="data-wire" />
  <path d="M 80 240 Q 350 320, 600 240 T 1120 220" fill="none" stroke="#a855f7" stroke-opacity="0.2" stroke-width="2" class="data-wire" style="animation-direction: reverse; animation-duration: 4s;" />

  <!-- Subtle Floating Accent Nodes -->
  <circle cx="180" cy="90" r="3" fill="#38bdf8" class="p1" />
  <circle cx="1020" cy="140" r="3.5" fill="#c084fc" class="p2" />
  <circle cx="950" cy="270" r="2.5" fill="#34d399" class="p3" />
  <circle cx="240" cy="280" r="3" fill="#60a5fa" class="p2" />

  <!-- FOREGROUND LAYER: Content strictly centered and layered on top -->

  <!-- Top Pill / Badge -->
  <g transform="translate(435, 38)">
    <rect width="330" height="30" rx="15" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="15" r="4.5" fill="#10b981" />
    <text x="28" y="20" fill="#94a3b8" font-size="11.5" font-weight="600" letter-spacing="1.2">CURATED DIRECTORY &amp; IAM BENCHMARKS</text>
  </g>

  <!-- Title: User Identity, Profile & Account Management -->
  <text x="600" y="125" text-anchor="middle" font-size="34" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">
    Awesome User Identity, Profile &amp; Account Management
  </text>

  <!-- Subtitle -->
  <text x="600" y="165" text-anchor="middle" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    The Definitive Guide to Modern CIAM, Enterprise IAM, Open-Source Auth &amp; Profile Orchestration
  </text>

  <!-- Key Architecture Pillars / Tech Badges -->
  <g transform="translate(180, 205)">
    <!-- Pill 1: Authentication & SSO -->
    <g class="pill" transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="url(#pill-grad-1)" stroke="url(#pill-border-1)" stroke-width="1.2" />
      <text x="90" y="26" text-anchor="middle" fill="#e0f2fe" font-size="13.5" font-weight="600">🔐 Auth &amp; SSO</text>
    </g>

    <!-- Pill 2: Passkeys & WebAuthn -->
    <g class="pill" transform="translate(205, 0)">
      <rect width="195" height="42" rx="10" fill="url(#pill-grad-2)" stroke="url(#pill-border-2)" stroke-width="1.2" />
      <text x="97" y="26" text-anchor="middle" fill="#f3e8ff" font-size="13.5" font-weight="600">🔑 Passkeys &amp; MFA</text>
    </g>

    <!-- Pill 3: CIAM & Profiles -->
    <g class="pill" transform="translate(425, 0)">
      <rect width="200" height="42" rx="10" fill="url(#pill-grad-1)" stroke="url(#pill-border-1)" stroke-width="1.2" />
      <text x="100" y="26" text-anchor="middle" fill="#e0f2fe" font-size="13.5" font-weight="600">👤 User Profiles &amp; SCIM</text>
    </g>

    <!-- Pill 4: Open Source & Self-Host -->
    <g class="pill" transform="translate(650, 0)">
      <rect width="190" height="42" rx="10" fill="url(#pill-grad-3)" stroke="url(#pill-border-3)" stroke-width="1.2" />
      <text x="95" y="26" text-anchor="middle" fill="#d1fae5" font-size="13.5" font-weight="600">⚡ Open-Source IAM</text>
    </g>
  </g>

  <!-- Bottom Metric / Status Strip -->
  <g transform="translate(0, 290)">
    <line x1="300" y1="0" x2="900" y2="0" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
    <text x="360" y="32" text-anchor="middle" fill="#64748b" font-size="13" font-weight="500">🏢 SaaS Market Giants</text>
    <text x="360" y="50" text-anchor="middle" fill="#38bdf8" font-size="13.5" font-weight="700">Ranked by Scale</text>

    <text x="600" y="32" text-anchor="middle" fill="#64748b" font-size="13" font-weight="500">💰 Pricing &amp; Limits</text>
    <text x="600" y="50" text-anchor="middle" fill="#a855f7" font-size="13.5" font-weight="700">Specific Starting Tiers</text>

    <text x="840" y="32" text-anchor="middle" fill="#64748b" font-size="13" font-weight="500">⭐ Top Open Source</text>
    <text x="840" y="50" text-anchor="middle" fill="#34d399" font-size="13.5" font-weight="700">Live Stars Ranked</text>
  </g>
</svg>
